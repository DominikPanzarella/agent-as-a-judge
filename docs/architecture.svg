<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0077FF"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07000"/>
    </marker>
    <style>
      .box { fill: #E5F1FF; stroke: #0077FF; stroke-width: 2; }
      .data { fill: #FFFFFF; stroke: #0077FF; stroke-width: 2; }
      .script { fill: #F4F4F4; stroke: #777777; stroke-width: 1.5; }
      .memo { fill: #FFF4E8; stroke: #E07000; stroke-width: 2; stroke-dasharray: 6 4; }
      .cost { fill: #FAFAFA; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .t { font-size: 15px; font-weight: bold; fill: #1A1A1A; }
      .s { font-size: 13px; fill: #444444; }
      .i { font-size: 13px; fill: #666666; font-style: italic; }
      .h { font-size: 17px; font-weight: bold; fill: #0077FF; }
      .lab { font-size: 12px; fill: #0077FF; }
      .labo { font-size: 12px; fill: #E07000; font-weight: bold; }
      .chip { font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .ab { stroke: #0077FF; stroke-width: 2; fill: none; marker-end: url(#ab); }
      .ao { stroke: #E07000; stroke-width: 2; fill: none; marker-end: url(#ao); }
      .aod { stroke: #E07000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="850" fill="#FFFFFF"/>

  <!-- column headers -->
  <text class="h" x="40" y="45">1  Data</text>
  <text class="h" x="420" y="45">2  Generation loop, one class at a time</text>
  <text class="h" x="1050" y="45">3  Evaluation</text>
  <text class="i" x="1050" y="66">tests hidden from coder and judge</text>

  <!-- 1 data -->
  <rect class="data" x="40" y="90" width="135" height="90" rx="8"/>
  <text class="t" x="107.5" y="122" text-anchor="middle">ClassEval</text>
  <text class="s" x="107.5" y="145" text-anchor="middle">100 classes,</text>
  <text class="s" x="107.5" y="163" text-anchor="middle">410 methods</text>

  <rect class="data" x="195" y="90" width="135" height="90" rx="8"/>
  <text class="t" x="262.5" y="122" text-anchor="middle">benchmarks+</text>
  <text class="s" x="262.5" y="145" text-anchor="middle">issue flags</text>
  <text class="s" x="262.5" y="163" text-anchor="middle">per method</text>

  <path class="ab" d="M107,180 L150,277"/>
  <path class="ab" d="M262,180 L220,277"/>

  <rect class="script" x="40" y="280" width="290" height="80" rx="8"/>
  <text class="t" x="185" y="312" text-anchor="middle">select_classes.py</text>
  <text class="s" x="185" y="337" text-anchor="middle">72 classes, 295 methods</text>

  <path class="ab" d="M185,360 L185,397"/>

  <rect class="script" x="40" y="400" width="290" height="80" rx="8"/>
  <text class="t" x="185" y="432" text-anchor="middle">order_methods.py</text>
  <text class="s" x="185" y="457" text-anchor="middle">fixed method order per class</text>

  <path class="ab" d="M330,430 L417,430"/>
  <text class="lab" x="374" y="420" text-anchor="middle">next method</text>

  <!-- cost log spans the loop and the evaluation -->
  <rect class="cost" x="420" y="88" width="940" height="62" rx="8"/>
  <text class="t" x="440" y="114">Cost log</text>
  <text class="s" x="440" y="136">tokens and dollars of every request to OpenRouter and OpenAI; the run stops when either 10 $ budget reaches 70%</text>

  <!-- 2 generation loop -->
  <rect class="data" x="420" y="230" width="240" height="80" rx="8"/>
  <text class="t" x="540" y="258" text-anchor="middle">Prompt</text>
  <text class="s" x="540" y="280" text-anchor="middle">skeleton, methods written so far,</text>
  <text class="s" x="540" y="298" text-anchor="middle">docstring of the next method</text>

  <path class="ab" d="M540,310 L540,377"/>

  <rect class="box" x="420" y="380" width="240" height="100" rx="8"/>
  <text class="t" x="540" y="414" text-anchor="middle">Coder</text>
  <text class="s" x="540" y="438" text-anchor="middle">Qwen via OpenRouter</text>
  <text class="s" x="540" y="458" text-anchor="middle">writes one method</text>

  <rect class="box" x="740" y="380" width="240" height="100" rx="8"/>
  <text class="t" x="860" y="414" text-anchor="middle">Judge</text>
  <text class="s" x="860" y="438" text-anchor="middle">GPT-6 Luna via OpenAI</text>
  <text class="s" x="860" y="458" text-anchor="middle">OK or NOT OK, with a reason</text>

  <path class="ab" d="M660,410 L737,410"/>
  <text class="lab" x="700" y="401" text-anchor="middle">new method</text>
  <path class="ao" d="M740,452 L663,452"/>
  <text class="labo" x="700" y="472" text-anchor="middle">feedback</text>

  <rect class="memo" x="740" y="230" width="240" height="80" rx="8"/>
  <text class="t" x="860" y="258" text-anchor="middle">Judge memory (C3)</text>
  <text class="s" x="860" y="280" text-anchor="middle">verdicts the tests proved wrong</text>
  <text class="s" x="860" y="298" text-anchor="middle">in earlier rounds</text>

  <path class="aod" d="M860,310 L860,377"/>

  <path class="ab" d="M540,480 L540,557"/>
  <text class="i" x="552" y="524">repeat for every method</text>

  <rect class="data" x="420" y="560" width="240" height="70" rx="8"/>
  <text class="t" x="540" y="590" text-anchor="middle">Generated class</text>
  <text class="s" x="540" y="612" text-anchor="middle">methods in the fixed order</text>

  <!-- 3 evaluation -->
  <rect class="box" x="1050" y="230" width="310" height="80" rx="8"/>
  <text class="t" x="1205" y="258" text-anchor="middle">Analysis</text>
  <text class="s" x="1205" y="280" text-anchor="middle">pass rates, McNemar tests,</text>
  <text class="s" x="1205" y="298" text-anchor="middle">bootstrap confidence intervals</text>

  <rect class="box" x="1050" y="380" width="310" height="100" rx="8"/>
  <text class="t" x="1205" y="414" text-anchor="middle">Judge vs tests</text>
  <text class="s" x="1205" y="438" text-anchor="middle">accuracy, Cohen's κ,</text>
  <text class="s" x="1205" y="458" text-anchor="middle">rate of false OK verdicts</text>

  <rect class="script" x="1050" y="560" width="310" height="70" rx="8"/>
  <text class="t" x="1205" y="590" text-anchor="middle">Test harness</text>
  <text class="s" x="1205" y="612" text-anchor="middle">ClassEval tests, pass or fail per method</text>

  <path class="ab" d="M980,430 L1047,430"/>
  <text class="lab" x="1014" y="421" text-anchor="middle">verdicts</text>
  <path class="ab" d="M660,595 L1047,595"/>
  <path class="ab" d="M1205,560 L1205,483"/>
  <path class="ab" d="M1205,380 L1205,313"/>
  <path class="ab" d="M1360,580 L1385,580 L1385,270 L1363,270"/>

  <!-- C3: wrong verdicts go to the judge memory -->
  <path class="aod" d="M1050,395 L1015,395 L1015,270 L983,270"/>
  <text class="labo" x="1021" y="338">C3</text>

  <!-- C4: real test results go to the coder -->
  <path class="aod" d="M1205,630 L1205,680 L380,680 L380,466 L417,466"/>
  <text class="labo" x="800" y="700" text-anchor="middle">C4: real test results go to the coder</text>

  <!-- legend -->
  <line x1="40" y1="725" x2="1360" y2="725" stroke="#DDDDDD" stroke-width="1"/>
  <text class="t" x="40" y="755">Setups</text>
  <text class="i" x="110" y="755">C0 to C2 for the midway report, C3 and C4 for the final one</text>

  <rect x="40" y="772" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="62" y="790" text-anchor="middle">C0</text>
  <text class="s" x="94" y="790">no feedback</text>
  <text class="s" x="94" y="808">(baseline)</text>

  <rect x="304" y="772" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="326" y="790" text-anchor="middle">C1</text>
  <text class="s" x="358" y="790">the judge reviews the finished</text>
  <text class="s" x="358" y="808">class, one revision</text>

  <rect x="568" y="772" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="590" y="790" text-anchor="middle">C2</text>
  <text class="s" x="622" y="790">the judge checks each method,</text>
  <text class="s" x="622" y="808">one revision</text>

  <rect x="832" y="772" width="44" height="26" rx="13" fill="#E07000"/>
  <text class="chip" x="854" y="790" text-anchor="middle">C3</text>
  <text class="s" x="886" y="790">like C2, plus the judge</text>
  <text class="s" x="886" y="808">memory of its mistakes</text>

  <rect x="1096" y="772" width="44" height="26" rx="13" fill="#E07000"/>
  <text class="chip" x="1118" y="790" text-anchor="middle">C4</text>
  <text class="s" x="1150" y="790">the coder sees the real</text>
  <text class="s" x="1150" y="808">test results (best case)</text>
</svg>
