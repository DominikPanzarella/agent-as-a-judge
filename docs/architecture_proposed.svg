<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0077FF"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07000"/>
    </marker>
    <style>
      .box { fill: #E5F1FF; stroke: #0077FF; stroke-width: 2; }
      .data { fill: #FFFFFF; stroke: #0077FF; stroke-width: 2; }
      .script { fill: #F4F4F4; stroke: #777777; stroke-width: 1.5; }
      .memo { fill: #FFF4E8; stroke: #E07000; stroke-width: 2; stroke-dasharray: 6 4; }
      .t { font-size: 16px; font-weight: bold; fill: #1A1A1A; }
      .s { font-size: 13px; fill: #555555; }
      .i { font-size: 13px; fill: #666666; font-style: italic; }
      .h { font-size: 17px; font-weight: bold; fill: #0077FF; }
      .lab { font-size: 12px; fill: #0077FF; }
      .labo { font-size: 13px; fill: #E07000; font-weight: bold; }
      .num { font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .ab { stroke: #0077FF; stroke-width: 2; fill: none; marker-end: url(#ab); }
      .bl { stroke: #0077FF; stroke-width: 2; fill: none; }
      .ao { stroke: #E07000; stroke-width: 2; fill: none; marker-end: url(#ao); }
      .aod { stroke: #E07000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#FFFFFF"/>

  <!-- column headers -->
  <text class="h" x="40" y="40">1  Data</text>
  <text class="h" x="400" y="40">2  Generation loop, one method at a time</text>
  <text class="h" x="1080" y="40">3  Evaluation</text>

  <!-- 1 data -->
  <rect class="data" x="40" y="70" width="125" height="50" rx="8"/>
  <text class="t" x="102.5" y="101" text-anchor="middle">ClassEval</text>
  <rect class="data" x="175" y="70" width="125" height="50" rx="8"/>
  <text class="t" x="237.5" y="101" text-anchor="middle">benchmarks+</text>

  <rect class="script" x="40" y="165" width="260" height="64" rx="8"/>
  <text class="t" x="170" y="192" text-anchor="middle">Class selection</text>
  <text class="s" x="170" y="213" text-anchor="middle">71 classes, 289 methods</text>

  <path class="ab" d="M102.5,120 L130,162"/>
  <path class="ab" d="M237.5,120 L210,162"/>
  <path class="ab" d="M300,197 L345,197 L345,95 L397,95"/>

  <!-- 2 loop, coder side -->
  <rect class="data" x="400" y="70" width="240" height="50" rx="8"/>
  <text class="t" x="520" y="101" text-anchor="middle">Prompt</text>

  <rect class="memo" x="400" y="170" width="240" height="50" rx="8"/>
  <text class="t" x="520" y="201" text-anchor="middle">First versions of C0</text>

  <rect class="box" x="400" y="280" width="240" height="70" rx="8"/>
  <text class="t" x="520" y="310" text-anchor="middle">Coder</text>
  <text class="s" x="520" y="332" text-anchor="middle">Qwen 3.8 27B</text>

  <rect class="data" x="400" y="420" width="240" height="50" rx="8"/>
  <text class="t" x="520" y="451" text-anchor="middle">Generated class</text>

  <path class="ab" d="M520,120 L520,167"/>
  <path class="ab" d="M520,220 L520,277"/>
  <path class="ab" d="M520,350 L520,417"/>

  <!-- 2 loop, judge side -->
  <rect class="memo" x="760" y="70" width="240" height="50" rx="8"/>
  <text class="t" x="880" y="101" text-anchor="middle">Controls</text>

  <rect class="memo" x="760" y="170" width="240" height="50" rx="8"/>
  <text class="t" x="880" y="201" text-anchor="middle">Judge memory</text>
  <path class="aod" d="M880,220 L880,277"/>

  <rect class="box" x="760" y="280" width="240" height="70" rx="8"/>
  <text class="t" x="880" y="310" text-anchor="middle">Judge</text>
  <text class="s" x="880" y="332" text-anchor="middle">GPT-6 Luna</text>

  <path class="ab" d="M640,300 L757,300"/>
  <text class="lab" x="698" y="292" text-anchor="middle">method</text>
  <path class="ao" d="M760,330 L643,330"/>
  <text class="labo" x="688" y="352">feedback</text>

  <!-- 3 evaluation -->
  <rect class="box" x="1080" y="70" width="280" height="50" rx="8"/>
  <text class="t" x="1220" y="101" text-anchor="middle">Analysis</text>

  <rect class="memo" x="1080" y="170" width="280" height="50" rx="8"/>
  <text class="t" x="1220" y="201" text-anchor="middle">Our labels</text>
  <path class="aod" d="M1220,220 L1220,277"/>

  <rect class="box" x="1080" y="280" width="280" height="70" rx="8"/>
  <text class="t" x="1220" y="310" text-anchor="middle">Judge vs tests and labels</text>
  <text class="s" x="1220" y="332" text-anchor="middle">TPR, TNR, κ</text>

  <rect class="script" x="1080" y="420" width="280" height="64" rx="8"/>
  <text class="t" x="1220" y="447" text-anchor="middle">Test harness</text>
  <text class="s" x="1220" y="468" text-anchor="middle">tests hidden from both agents</text>

  <path class="ab" d="M1000,330 L1077,330"/>
  <text class="lab" x="1040" y="322" text-anchor="middle">verdicts</text>
  <path class="ab" d="M640,445 L1077,445"/>
  <path class="ab" d="M1220,420 L1220,353"/>

  <!-- results go to the analysis -->
  <path class="bl" d="M1360,315 L1385,315"/>
  <path class="ab" d="M1360,452 L1385,452 L1385,95 L1363,95"/>

  <!-- C3: confirmed corrections go to the judge memory -->
  <path class="aod" d="M1080,292 L1040,292 L1040,195 L1003,195"/>
  <text class="labo" x="1047" y="250">C3</text>

  <!-- C4: real test results go to the coder -->
  <path class="aod" d="M1220,484 L1220,530 L370,530 L370,335 L397,335"/>
  <text class="labo" x="795" y="550" text-anchor="middle">C4</text>

  <!-- numbered proposals, explained in the README and the roadmap -->
  <circle cx="400" cy="170" r="12" fill="#E07000"/><text class="num" x="400" y="175" text-anchor="middle">1</text>
  <circle cx="1080" cy="170" r="12" fill="#E07000"/><text class="num" x="1080" y="175" text-anchor="middle">2</text>
  <circle cx="667" cy="347" r="12" fill="#E07000"/><text class="num" x="667" y="352" text-anchor="middle">3</text>
  <circle cx="1000" cy="280" r="12" fill="#E07000"/><text class="num" x="1000" y="285" text-anchor="middle">4</text>
  <circle cx="760" cy="170" r="12" fill="#E07000"/><text class="num" x="760" y="175" text-anchor="middle">5</text>
  <circle cx="760" cy="70" r="12" fill="#E07000"/><text class="num" x="760" y="75" text-anchor="middle">6</text>

  <!-- legend -->
  <line x1="40" y1="572" x2="1360" y2="572" stroke="#DDDDDD" stroke-width="1.5"/>
  <rect class="box" x="40" y="586" width="34" height="20" rx="4"/>
  <text class="i" x="84" y="601">solid: built and piloted</text>
  <rect class="memo" x="290" y="586" width="34" height="20" rx="4"/>
  <text class="i" x="334" y="601">orange, dashed: proposed or planned</text>
  <circle cx="610" cy="596" r="12" fill="#E07000"/><text class="num" x="610" y="601" text-anchor="middle">n</text>
  <text class="i" x="630" y="601">change n, explained in the accompanying text</text>
</svg>
