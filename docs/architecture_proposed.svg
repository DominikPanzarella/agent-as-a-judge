<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0077FF"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07000"/>
    </marker>
    <style>
      .box { fill: #E5F1FF; stroke: #0077FF; stroke-width: 2; }
      .data { fill: #FFFFFF; stroke: #0077FF; stroke-width: 2; }
      .script { fill: #F4F4F4; stroke: #777777; stroke-width: 1.5; }
      .memo { fill: #FFF4E8; stroke: #E07000; stroke-width: 2; stroke-dasharray: 6 4; }
      .cost { fill: #FAFAFA; stroke: #999999; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .t { font-size: 15px; font-weight: bold; fill: #1A1A1A; }
      .s { font-size: 13px; fill: #444444; }
      .so { font-size: 13px; fill: #E07000; font-weight: bold; }
      .i { font-size: 13px; fill: #666666; font-style: italic; }
      .h { font-size: 17px; font-weight: bold; fill: #0077FF; }
      .lab { font-size: 12px; fill: #0077FF; }
      .labo { font-size: 12px; fill: #E07000; font-weight: bold; }
      .chip { font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .ab { stroke: #0077FF; stroke-width: 2; fill: none; marker-end: url(#ab); }
      .bl { stroke: #0077FF; stroke-width: 2; fill: none; }
      .ao { stroke: #E07000; stroke-width: 2; fill: none; marker-end: url(#ao); }
      .aod { stroke: #E07000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
      .od { stroke: #E07000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#FFFFFF"/>

  <!-- column headers -->
  <text class="h" x="40" y="45">1  Data</text>
  <text class="h" x="400" y="45">2  Generation loop, one class at a time</text>
  <text class="h" x="1050" y="45">3  Evaluation</text>
  <text class="i" x="1050" y="66">tests hidden from coder and judge</text>

  <!-- 1 data -->
  <rect class="data" x="40" y="80" width="135" height="70" rx="8"/>
  <text class="t" x="107.5" y="103" text-anchor="middle">ClassEval</text>
  <text class="s" x="107.5" y="122" text-anchor="middle">100 classes,</text>
  <text class="s" x="107.5" y="138" text-anchor="middle">410 methods</text>

  <rect class="data" x="180" y="80" width="135" height="70" rx="8"/>
  <text class="t" x="252.5" y="103" text-anchor="middle">benchmarks+</text>
  <text class="s" x="252.5" y="122" text-anchor="middle">issue flags</text>
  <text class="s" x="252.5" y="138" text-anchor="middle">per method</text>

  <rect class="script" x="40" y="180" width="280" height="55" rx="8"/>
  <text class="t" x="180" y="203" text-anchor="middle">select_classes.py</text>
  <text class="s" x="180" y="223" text-anchor="middle">71 classes, 289 methods</text>

  <rect class="script" x="40" y="265" width="280" height="55" rx="8"/>
  <text class="t" x="180" y="288" text-anchor="middle">pick_dev_classes.py</text>
  <text class="s" x="180" y="308" text-anchor="middle">10 classes for the pilot, 61 for the analysis</text>

  <rect class="script" x="40" y="350" width="280" height="55" rx="8"/>
  <text class="t" x="180" y="373" text-anchor="middle">order_methods.py</text>
  <text class="s" x="180" y="393" text-anchor="middle">fixed order, checked against the fields</text>

  <path class="ab" d="M107.5,150 L132,177"/>
  <path class="ab" d="M252.5,150 L225,177"/>
  <path class="ab" d="M180,235 L180,262"/>
  <path class="ab" d="M180,320 L180,347"/>
  <path class="ab" d="M320,377 L397,377"/>
  <text class="lab" x="358" y="369" text-anchor="middle">next method</text>

  <!-- cost log -->
  <rect class="cost" x="400" y="80" width="960" height="50" rx="8"/>
  <text class="t" x="420" y="102">Cost log</text>
  <text class="s" x="420" y="120">tokens and dollars of every request to OpenRouter and OpenAI; the run stops when either 10 $ budget reaches 70%</text>

  <!-- 2 loop, coder side -->
  <rect class="data" x="400" y="155" width="240" height="65" rx="8"/>
  <text class="t" x="520" y="178" text-anchor="middle">Prompt</text>
  <text class="s" x="520" y="196" text-anchor="middle">skeleton, methods written so far,</text>
  <text class="s" x="520" y="212" text-anchor="middle">docstring of the next method</text>

  <rect class="memo" x="400" y="248" width="240" height="64" rx="8"/>
  <text class="t" x="520" y="271" text-anchor="middle">First versions of C0</text>
  <text class="s" x="520" y="289" text-anchor="middle">same prompt as in C0: reuse its</text>
  <text class="s" x="520" y="305" text-anchor="middle">first version instead of a new one</text>

  <path class="ab" d="M520,220 L520,245"/>
  <path class="ab" d="M520,312 L520,337"/>

  <rect class="box" x="400" y="340" width="240" height="100" rx="8"/>
  <text class="t" x="520" y="372" text-anchor="middle">Coder</text>
  <text class="s" x="520" y="396" text-anchor="middle">Qwen 3.8 27B via OpenRouter</text>
  <text class="s" x="520" y="416" text-anchor="middle">writes or revises one method</text>

  <path class="ab" d="M520,440 L520,487"/>
  <text class="i" x="532" y="470">repeat for every method</text>

  <rect class="data" x="400" y="490" width="240" height="65" rx="8"/>
  <text class="t" x="520" y="515" text-anchor="middle">Generated class</text>
  <text class="s" x="520" y="537" text-anchor="middle">first and final version of each method</text>

  <!-- 2 loop, judge side -->
  <rect class="memo" x="760" y="155" width="240" height="70" rx="8"/>
  <text class="t" x="880" y="180" text-anchor="middle">Judge memory (C3)</text>
  <text class="s" x="880" y="199" text-anchor="middle">only corrections confirmed by hand,</text>
  <text class="s" x="880" y="215" text-anchor="middle">about ten at most</text>
  <path class="aod" d="M880,225 L880,337"/>

  <rect class="box" x="760" y="340" width="240" height="100" rx="8"/>
  <text class="t" x="880" y="362" text-anchor="middle">Judge</text>
  <text class="s" x="880" y="380" text-anchor="middle">GPT-6 Luna, medium effort,</text>
  <text class="s" x="880" y="396" text-anchor="middle">runs code up to 5 times</text>
  <text class="so" x="880" y="414" text-anchor="middle">v3: one check per</text>
  <text class="so" x="880" y="430" text-anchor="middle">docstring requirement</text>

  <path class="ab" d="M640,372 L757,372"/>
  <text class="lab" x="700" y="364" text-anchor="middle">new method</text>
  <path class="ao" d="M760,408 L643,408"/>
  <text class="labo" x="700" y="426" text-anchor="middle">feedback:</text>
  <text class="labo" x="700" y="440" text-anchor="middle">reason, code run</text>
  <text class="labo" x="700" y="454" text-anchor="middle">and its output</text>

  <rect class="memo" x="760" y="590" width="240" height="75" rx="8"/>
  <text class="t" x="880" y="614" text-anchor="middle">Controls</text>
  <text class="s" x="880" y="634" text-anchor="middle">in place of the judge: self-refine,</text>
  <text class="s" x="880" y="652" text-anchor="middle">or NOT OK without the reason</text>

  <!-- 3 evaluation -->
  <rect class="box" x="1050" y="155" width="310" height="72" rx="8"/>
  <text class="t" x="1205" y="175" text-anchor="middle">Analysis</text>
  <text class="s" x="1205" y="192" text-anchor="middle">McNemar paired by method, bootstrap</text>
  <text class="s" x="1205" y="207" text-anchor="middle">over classes, pass^k if repeated</text>
  <text class="so" x="1205" y="222" text-anchor="middle">pass rate from the judge, corrected</text>

  <rect class="memo" x="1050" y="248" width="310" height="66" rx="8"/>
  <text class="t" x="1205" y="270" text-anchor="middle">Human labels</text>
  <text class="s" x="1205" y="292" text-anchor="middle">written criteria first, two raters</text>
  <text class="s" x="1205" y="307" text-anchor="middle">alone, then a consensus</text>
  <path class="aod" d="M1205,314 L1205,337"/>

  <rect class="box" x="1050" y="340" width="310" height="100" rx="8"/>
  <text class="t" x="1205" y="372" text-anchor="middle">Judge vs tests and labels</text>
  <text class="s" x="1205" y="396" text-anchor="middle">TPR, TNR and Cohen's κ,</text>
  <text class="s" x="1205" y="416" text-anchor="middle">against the tests and our labels</text>

  <rect class="script" x="1050" y="490" width="310" height="65" rx="8"/>
  <text class="t" x="1205" y="515" text-anchor="middle">Test harness</text>
  <text class="s" x="1205" y="537" text-anchor="middle">ClassEval tests, pass or fail per method</text>

  <path class="ab" d="M1000,408 L1047,408"/>
  <text class="lab" x="1025" y="400" text-anchor="middle">verdicts</text>
  <path class="ab" d="M640,522 L1047,522"/>
  <path class="ab" d="M1205,490 L1205,443"/>

  <!-- tests and judge scores go to the analysis -->
  <path class="bl" d="M1360,390 L1385,390"/>
  <path class="ab" d="M1360,522 L1385,522 L1385,190 L1363,190"/>

  <!-- C3: confirmed corrections go to the judge memory -->
  <path class="aod" d="M1050,360 L1025,360 L1025,190 L1003,190"/>
  <text class="labo" x="1019" y="280" text-anchor="end">C3</text>

  <!-- C4: real test results go to the coder -->
  <path class="aod" d="M1205,555 L1205,700 L370,700 L370,425 L397,425"/>
  <text class="labo" x="790" y="718" text-anchor="middle">C4: real test results go to the coder</text>

  <!-- setups -->
  <line x1="40" y1="745" x2="1360" y2="745" stroke="#DDDDDD" stroke-width="1.5"/>
  <text class="t" x="40" y="775">Setups</text>
  <text class="i" x="110" y="775">blue: built and piloted on 10 classes; orange and dashed: proposed or planned, not built yet</text>

  <rect x="40" y="795" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="62" y="813" text-anchor="middle">C0</text>
  <text class="s" x="94" y="806">no feedback (baseline);</text>
  <text class="s" x="94" y="824">its first versions are shared</text>

  <rect x="304" y="795" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="326" y="813" text-anchor="middle">C1</text>
  <text class="s" x="358" y="806">the judge reviews the finished</text>
  <text class="s" x="358" y="824">class, one revision</text>

  <rect x="568" y="795" width="44" height="26" rx="13" fill="#0077FF"/>
  <text class="chip" x="590" y="813" text-anchor="middle">C2</text>
  <text class="s" x="622" y="806">the judge checks each method,</text>
  <text class="s" x="622" y="824">one revision</text>

  <rect x="832" y="795" width="44" height="26" rx="13" fill="#E07000"/>
  <text class="chip" x="854" y="813" text-anchor="middle">C3</text>
  <text class="s" x="886" y="806">like C2, plus the memory of</text>
  <text class="s" x="886" y="824">corrections confirmed by hand</text>

  <rect x="1096" y="795" width="44" height="26" rx="13" fill="#E07000"/>
  <text class="chip" x="1118" y="813" text-anchor="middle">C4</text>
  <text class="s" x="1150" y="806">the coder sees the real</text>
  <text class="s" x="1150" y="824">test results (best case)</text>
</svg>
