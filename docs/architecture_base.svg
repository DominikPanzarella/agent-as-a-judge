<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0077FF"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07000"/>
    </marker>
    <style>
      .box { fill: #E5F1FF; stroke: #0077FF; stroke-width: 2; }
      .data { fill: #FFFFFF; stroke: #0077FF; stroke-width: 2; }
      .script { fill: #F4F4F4; stroke: #777777; stroke-width: 1.5; }
      .memo { fill: #FFF4E8; stroke: #E07000; stroke-width: 2; stroke-dasharray: 6 4; }
      .new { fill: #FFF4E8; stroke: #E07000; stroke-width: 2; }
      .t { font-size: 16px; font-weight: bold; fill: #1A1A1A; }
      .s { font-size: 13px; fill: #555555; }
      .so { font-size: 13px; font-weight: bold; fill: #E07000; }
      .i { font-size: 13px; fill: #666666; font-style: italic; }
      .h { font-size: 17px; font-weight: bold; fill: #0077FF; }
      .lab { font-size: 12px; fill: #0077FF; }
      .labo { font-size: 12px; fill: #E07000; font-weight: bold; }
      .ab { stroke: #0077FF; stroke-width: 2; fill: none; marker-end: url(#ab); }
      .bl { stroke: #0077FF; stroke-width: 2; fill: none; }
      .ao { stroke: #E07000; stroke-width: 2; fill: none; marker-end: url(#ao); }
      .aod { stroke: #E07000; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="560" fill="#FFFFFF"/>

  <!-- column headers -->
  <text class="h" x="40" y="40">1  Data</text>
  <text class="h" x="400" y="40">2  Generation loop, one method at a time</text>
  <text class="h" x="1080" y="40">3  Evaluation</text>

  <!-- 1 data -->
  <rect class="data" x="40" y="70" width="125" height="50" rx="8"/>
  <text class="t" x="102.5" y="101" text-anchor="middle">ClassEval</text>
  <rect class="data" x="175" y="70" width="125" height="50" rx="8"/>
  <text class="t" x="237.5" y="101" text-anchor="middle">benchmarks+</text>

  <rect class="script" x="40" y="165" width="260" height="64" rx="8"/>
  <text class="t" x="170" y="192" text-anchor="middle">Class selection</text>
  <text class="s" x="170" y="213" text-anchor="middle">71 classes, 289 methods</text>

  <path class="ab" d="M102.5,120 L130,162"/>
  <path class="ab" d="M237.5,120 L210,162"/>
  <path class="ab" d="M300,197 L345,197 L345,95 L397,95"/>

  <!-- 2 loop, coder side -->
  <rect class="data" x="400" y="70" width="240" height="50" rx="8"/>
  <text class="t" x="520" y="101" text-anchor="middle">Prompt</text>

  <rect class="box" x="400" y="280" width="240" height="70" rx="8"/>
  <text class="t" x="520" y="310" text-anchor="middle">Coder</text>
  <text class="s" x="520" y="332" text-anchor="middle">Qwen 3.8 27B</text>

  <rect class="data" x="400" y="420" width="240" height="50" rx="8"/>
  <text class="t" x="520" y="451" text-anchor="middle">Generated class</text>

  <path class="ab" d="M520,120 L520,277"/>
  <path class="ab" d="M520,350 L520,417"/>

  <!-- 2 loop, judge side -->
  <rect class="memo" x="760" y="170" width="240" height="50" rx="8"/>
  <text class="t" x="880" y="201" text-anchor="middle">Judge memory (C3)</text>
  <path class="aod" d="M880,220 L880,269"/>

  <rect class="box" x="760" y="272" width="240" height="86" rx="8"/>
  <text class="t" x="880" y="298" text-anchor="middle">Judge</text>
  <text class="s" x="880" y="318" text-anchor="middle">GPT-6 Luna, runs the code</text>
  <text class="so" x="880" y="338" text-anchor="middle">docstring + ClassEval tests</text>

  <path class="ab" d="M640,300 L757,300"/>
  <text class="lab" x="698" y="292" text-anchor="middle">method</text>
  <path class="ab" d="M760,330 L643,330"/>
  <text class="lab" x="700" y="348" text-anchor="middle">feedback</text>

  <!-- 3 evaluation -->
  <rect class="box" x="1080" y="70" width="280" height="50" rx="8"/>
  <text class="t" x="1220" y="101" text-anchor="middle">Analysis</text>

  <rect class="box" x="1080" y="160" width="280" height="70" rx="8"/>
  <text class="t" x="1220" y="190" text-anchor="middle">Judge vs tests</text>
  <text class="s" x="1220" y="212" text-anchor="middle">TPR, TNR, κ</text>

  <rect class="data" x="1080" y="290" width="280" height="64" rx="8"/>
  <text class="t" x="1220" y="317" text-anchor="middle">ClassEval tests</text>
  <text class="s" x="1220" y="338" text-anchor="middle">all test cases of each method</text>

  <rect class="script" x="1080" y="420" width="280" height="64" rx="8"/>
  <text class="t" x="1220" y="447" text-anchor="middle">Test harness</text>
  <text class="s" x="1220" y="468" text-anchor="middle">runs the tests in a sandbox</text>

  <!-- verdicts to the comparison with the tests -->
  <path class="ab" d="M1000,290 L1040,290 L1040,195 L1077,195"/>
  <text class="lab" x="1046" y="258">verdicts</text>
  <!-- the tests go to the judge (new) and to the harness, which gives the grade -->
  <path class="ao" d="M1080,322 L1003,322"/>
  <text class="labo" x="1041" y="314" text-anchor="middle">tests</text>
  <path class="ab" d="M1220,354 L1220,417"/>
  <path class="ab" d="M640,452 L1077,452"/>
  <path class="ab" d="M1220,160 L1220,123"/>

  <!-- results go to the comparison and to the analysis -->
  <path class="ab" d="M1360,452 L1385,452 L1385,95 L1363,95"/>
  <path class="ab" d="M1385,195 L1363,195"/>

  <!-- C3: confirmed corrections go to the judge memory -->
  <path class="aod" d="M1080,178 L1003,178"/>
  <text class="labo" x="1041" y="170" text-anchor="middle">C3</text>


  <!-- legend -->
  <line x1="40" y1="515" x2="1360" y2="515" stroke="#DDDDDD" stroke-width="1.5"/>
  <rect class="box" x="40" y="528" width="34" height="20" rx="4"/>
  <text class="i" x="84" y="543">solid: built and piloted</text>
  <rect class="new" x="290" y="528" width="34" height="20" rx="4"/>
  <text class="i" x="334" y="543">orange: new in the base version</text>
  <rect class="memo" x="590" y="528" width="34" height="20" rx="4"/>
  <text class="i" x="634" y="543">orange, dashed: planned</text>
</svg>
